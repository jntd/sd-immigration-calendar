name: Fetch samples (temporary)
on:
  push:
    branches: [main]
    paths: ['automation/fetch_samples.py']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 automation/fetch_samples.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b samples
          git add samples
          git commit -m "Samples"
          git push -f origin samples

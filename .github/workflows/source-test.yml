name: Source test
on:
  workflow_dispatch:
  push:
    paths: ['automation/source_test.py', '.github/workflows/source-test.yml']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python automation/source_test.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/source_test_results.md
          git commit -m "Source test results" || exit 0
          git push

name: Update calendar
on:
  schedule:
    - cron: '17 13 * * *'   # every day, about 5:17 or 6:17 am Pacific
  workflow_dispatch:
    inputs:
      handout:
        description: 'Also rebuild the printable handout (yes/no)'
        default: 'no'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update.yml'
      - 'automation/tools/**'
      - 'automation/evaluation/**'
      - 'automation/raw/page_events.json'
      - 'automation/raw/carlsbad.tsv'
      - 'automation/raw/chulavista.tsv'
      - 'automation/raw/nationalcity.tsv'
permissions:
  contents: write
concurrency:
  group: update-calendar
  cancel-in-progress: false
env:
  TZ: America/Los_Angeles
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always the newest state, even when runs queue up
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Collect sources
        run: python automation/tools/collect.py
      - name: Build the batch
        run: python automation/tools/build_batch.py
      - name: Label events
        run: python automation/tools/evaluate.py run
      - name: Build feeds
        run: python automation/tools/make_feeds.py
      - name: Check and publish
        id: publish
        continue-on-error: true
        run: python automation/tools/publish.py
      # The printable handout: every Monday morning, when asked for by hand, or when the newest
      # commit message contains [handout].
      - name: Decide whether to build the handout
        id: handout
        run: |
          if { [ "${{ github.event_name }}" = "schedule" ] && [ "$(date +%u)" = "1" ]; } \
             || [ "${{ github.event.inputs.handout }}" = "yes" ] \
             || git log -1 --pretty=%B | grep -q '\[handout\]'; then
            echo "build=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the handout
        if: steps.handout.outputs.build == 'yes' && steps.publish.outcome == 'success'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-inter
          pip install -q reportlab playwright pypdf
          python -m playwright install --with-deps chromium
          START=$(date +%F)
          python automation/tools/make_print.py --start "$START" --pdf
          python automation/tools/publish_handout.py "$START"
      - name: Save to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Automated update $(date +%F): $(grep -c BEGIN:VEVENT all.ics) events"
          git push || (git pull --rebase -X theirs -q && git push)
      - name: Report problems
        if: steps.publish.outcome == 'failure'
        run: |
          echo "The publish step reported a problem. See automation/status.md."
          exit 1
